<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For My Dearest Brother Lakshman 🌸</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="petals"></canvas>

<section id="welcome">
  <div class="bloom">🌺</div>
  <h1>To my dearest brother,<br>Lakshman</h1>
  <p class="sub">Ten little reasons why you are my whole world</p>
  <button id="openBtn">Open with love 🌸</button>
</section>

<main id="main" class="hidden">
  <header>
    <h2>Why I love you, Lakshman</h2>
    <p>Tap each flower to open a reason 💖</p>
    <p class="progress"><span id="count">0</span> of 10 opened</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer id="finale" class="hidden">
    <h3>And a thousand more reasons I couldn't fit in these boxes 💐</h3>
    <p>Always your loving sister,</p>
    <p class="sign">Sri Lakshmi 🌷</p>
  </footer>
</main>

<script src="script.js"></script>
</body>
</html>
